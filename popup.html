<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 450px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 0;
        }
        .container {
            background-color: white;
            padding: 20px;
            height: 100%;
        }
        h1 {
            color: #E4405F;
            font-size: 20px;
            margin-bottom: 15px;
            text-align: center;
        }
        .warning {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 12px;
            color: #856404;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
            font-size: 13px;
        }
        textarea, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            transition: border-color 0.3s;
        }
        textarea:focus, input[type="number"]:focus {
            outline: none;
            border-color: #E4405F;
            box-shadow: 0 0 0 3px rgba(228, 64, 95, 0.1);
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
        }
        .start-btn {
            background-color: #E4405F;
            color: white;
            grid-column: 1 / 3;
        }
        .start-btn:hover:not(:disabled) {
            background-color: #d63446;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(228, 64, 95, 0.3);
        }
        .start-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .stop-btn {
            background-color: #ff6b6b;
            color: white;
        }
        .stop-btn:hover:not(:disabled) {
            background-color: #ff5252;
            transform: translateY(-2px);
        }
        .stop-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .reset-btn {
            background-color: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }
        .reset-btn:hover {
            background-color: #e0e0e0;
            transform: translateY(-2px);
        }
        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            display: none;
            border-left: 4px solid;
        }
        .status.active {
            display: block;
            background-color: #d4edda;
            color: #155724;
            border-left-color: #28a745;
        }
        .status.error {
            display: block;
            background-color: #f8d7da;
            color: #721c24;
            border-left-color: #f5c6cb;
        }
        .progress {
            margin-top: 10px;
            font-size: 11px;
            color: #666;
            text-align: center;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: #e0e0e0;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: #E4405F;
            transition: width 0.3s;
            width: 0%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Insta Auto Comment</h1>
        
        <div class="warning">
            ⚠️ <strong>Aviso:</strong> Use com responsabilidade. Respeite os termos do Instagram.
        </div>

        <div class="form-group">
            <label for="profilesList">📍 Perfis (um por linha, com @):</label>
            <textarea id="profilesList" placeholder="@teste&#10;@perfil1&#10;@perfil2"></textarea>
        </div>

        <div class="form-group">
            <label for="comment">💬 Comentário:</label>
            <textarea id="comment" placeholder="você pode fazer uma campanha com @clientepremiadonegocios"></textarea>
        </div>

        <div class="form-group">
            <label for="interval">⏱️ Intervalo entre perfis (minutos):</label>
            <input type="number" id="interval" value="5" min="1" max="120">
        </div>

        <div class="button-group">
            <button class="start-btn" id="startBtn">▶️ Iniciar</button>
            <button class="stop-btn" id="stopBtn" disabled>⏹️ Parar</button>
            <button class="reset-btn" id="resetBtn">🔄 Limpar</button>
        </div>

        <div class="status" id="status"></div>
        <div class="progress" id="progress">
            <div class="progress-bar">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
